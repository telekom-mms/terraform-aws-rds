
---
name: terraform-ci

on:
  pull_request:
    branches: [main]

env:
  TEMPLATE_REPOSITORY: telekom-mms/terraform-template

jobs:
  call-terraform-ci:
    if: github.repository != '$TEMPLATE_REPOSITORY'
    uses: telekom-mms/.github/.github/workflows/terraform-ci.yml@eda1dcd90f2ea8506e5a882e37761d2dd07a6adf # main
    with:
      working-directory: examples/basic-rds
