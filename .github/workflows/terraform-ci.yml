
---
name: terraform-ci

on:
  pull_request:
    branches: [main]

env:
  TEMPLATE_REPOSITORY: telekom-mms/terraform-template

jobs:
  call-terraform-ci:
    if: github.repository != '$TEMPLATE_REPOSITORY'
    uses: telekom-mms/.github/.github/workflows/terraform-ci.yml@645d667620b9b55b5544254f9c16e587dd94c917 # main
    with:
      working-directory: examples/basic-rds
