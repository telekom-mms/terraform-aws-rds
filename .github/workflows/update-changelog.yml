
---
name: update-changelog

on:
  pull_request:
    types: [closed]

env:
  TEMPLATE_REPOSITORY: telekom-mms/terraform-template

jobs:
  call-update-changelog:
    if: github.repository != '$TEMPLATE_REPOSITORY'
    uses: telekom-mms/.github/.github/workflows/update-changelog.yml@d72a606aa01c43f7122c701c7f8d11e3c360dee9 # main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
